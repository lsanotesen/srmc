services:
  mysql:
    image: mysql:8.0
    container_name: srmc-mysql
    restart: unless-stopped
    command: --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: srmc
      MYSQL_USER: srmc
      MYSQL_PASSWORD: srmc123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./backend/init_sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: srmc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  backend:
    image: srmc-backend:latest
    build: ./backend
    container_name: srmc-backend
    restart: unless-stopped
    environment:
      - SECRET_KEY=VGhpcyBpcyBhIHNlY3JldCBtZXNzYWdlIGZvciBBVVM=
      - JWT_SECRET_KEY=srmc-jwt-secret-key-2024
      - DATABASE_URL=mysql+pymysql://srmc:srmc123@mysql:3306/srmc?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
      - AUDIT_LOG_RETENTION_DAYS=90
      - TZ=Asia/Shanghai
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    image: srmc-frontend:latest
    build: ./frontend
    container_name: srmc-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  agent:
    image: srmc-agent:latest
    build: ./srmc-agent
    container_name: srmc-agent
    restart: always
    depends_on:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./srmc-agent/config.yaml:/etc/srmc-agent/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST_IP=192.168.12.79
      - TZ=Asia/Shanghai